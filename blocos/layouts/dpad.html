<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D-Pad</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;background:#111318;color:#fff;font-family:Arial,sans-serif;height:100vh;display:grid;place-items:center;overflow:hidden}
.wrap{text-align:center}.wrap h2{font-size:12px;letter-spacing:.18em;color:#7b8797;margin:0 0 22px}.dpad{display:grid;grid-template-columns:110px 110px 110px;grid-template-rows:92px 92px 92px;gap:8px}.dpad button{border:0;border-radius:18px;background:#242933;color:#fff;font-size:30px}.dpad button:active{background:#4f7cff}.up{grid-column:2}.left{grid-row:2;grid-column:1}.stop{grid-row:2;grid-column:2;background:#e74b55!important;font-size:12px!important;font-weight:bold}.right{grid-row:2;grid-column:3}.down{grid-row:3;grid-column:2}
</style>
</head>
<body>

<div class="wrap"><h2>CLASSIC D-PAD</h2><div class="dpad"><button class="up" data-a="220" data-b="220">▲</button><button class="left" data-a="-170" data-b="170">◀</button><button class="stop" onclick="stopAll()">STOP</button><button class="right" data-a="170" data-b="-170">▶</button><button class="down" data-a="-200" data-b="-200">▼</button></div></div>

<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let lastA=999,lastB=999,lastT=0;
function sendSigned(a,b,force=false){
  a=Math.round(clamp(a,-255,255)); b=Math.round(clamp(b,-255,255));
  const now=Date.now();
  if(!force && now-lastT<55 && Math.abs(a-lastA)<3 && Math.abs(b-lastB)<3) return;
  lastT=now; lastA=a; lastB=b;
  const send=(m,v)=>fetch(`/joy?m=${m}&s=${Math.abs(v)}&d=${v>=0?'U':'D'}`).catch(()=>{});
  send('A',a); send('B',b);
}
function stopAll(){ lastA=lastB=0; fetch('/PARAR').catch(()=>{}); }
window.addEventListener('pagehide',stopAll);

document.querySelectorAll('[data-a]').forEach(b=>{const a=Number(b.dataset.a),c=Number(b.dataset.b);b.onpointerdown=()=>sendSigned(a,c,true);b.onpointerup=b.onpointerleave=()=>sendSigned(0,0,true)})
</script>
</body>
</html>
