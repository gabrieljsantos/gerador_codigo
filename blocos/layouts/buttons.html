<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Botões</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;background:#081018;color:white;font-family:Arial,sans-serif;height:100vh;overflow:hidden}
header{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #173044}header b{font-size:12px;letter-spacing:.16em;color:#64d8ff}header span{font-size:11px;color:#72889a}
main{height:calc(100vh - 60px);display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}
.motor{display:grid;grid-template-rows:auto 1fr 1fr 1fr 1fr;gap:9px}.motor h3{margin:0 0 3px;font-size:12px;color:#8ba0af;letter-spacing:.12em}
button{border:0;border-radius:14px;color:#fff;font-weight:800;touch-action:none}.f2{background:#05a865}.f1{background:#087d57}.r1{background:#b64b35}.r2{background:#e23434}.stop{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:150px;height:42px;background:#fff;color:#111;border-radius:999px}
button:active{filter:brightness(1.3);transform:scale(.98)}
</style>
</head>
<body>

<header><b>DIRECT BUTTONS</b><span>segure para mover</span></header>
<main>
 <section class="motor"><h3>ESQUERDO</h3><button class="f2" data-on="AF_A_ON" data-off="AF_A_OFF">FRENTE • 100%</button><button class="f1" data-on="AF_B_ON" data-off="AF_B_OFF">FRENTE • 70%</button><button class="r1" data-on="AR_B_ON" data-off="AR_B_OFF">RÉ • 70%</button><button class="r2" data-on="AR_A_ON" data-off="AR_A_OFF">RÉ • 100%</button></section>
 <section class="motor"><h3>DIREITO</h3><button class="f2" data-on="BF_A_ON" data-off="BF_A_OFF">FRENTE • 100%</button><button class="f1" data-on="BF_B_ON" data-off="BF_B_OFF">FRENTE • 70%</button><button class="r1" data-on="BR_B_ON" data-off="BR_B_OFF">RÉ • 70%</button><button class="r2" data-on="BR_A_ON" data-off="BR_A_OFF">RÉ • 100%</button></section>
</main><button class="stop" onclick="stopAll()">PARAR</button>

<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let lastA=999,lastB=999,lastT=0;
function sendSigned(a,b,force=false){
  a=Math.round(clamp(a,-255,255)); b=Math.round(clamp(b,-255,255));
  const now=Date.now();
  if(!force && now-lastT<55 && Math.abs(a-lastA)<3 && Math.abs(b-lastB)<3) return;
  lastT=now; lastA=a; lastB=b;
  const send=(m,v)=>fetch(`/joy?m=${m}&s=${Math.abs(v)}&d=${v>=0?'U':'D'}`).catch(()=>{});
  send('A',a); send('B',b);
}
function stopAll(){ lastA=lastB=0; fetch('/PARAR').catch(()=>{}); }
window.addEventListener('pagehide',stopAll);

document.querySelectorAll('[data-on]').forEach(b=>{let down=false;
 const on=()=>{if(down)return;down=true;fetch('/'+b.dataset.on).catch(()=>{})};
 const off=()=>{if(!down)return;down=false;fetch('/'+b.dataset.off).catch(()=>{})};
 b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;b.onpointercancel=off;
});
</script>
</body>
</html>
